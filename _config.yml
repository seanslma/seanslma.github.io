url: "https://seanslma.github.io"
baseurl: ""
permalink: /:title/ # default: /:year/:month/:day/:title/

title: "Learning Faster Python Fast"
author: "Sean Ma"
description: "Sean's Blogs" # This will show up in places like twitter, linkedin, etc, if share sites url as a post.
copyright_year: "2026"

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
email: "sean.sl.ma_at_gmail.com"
x_username: "sean_lma"
github_username: "seanslma"
linkedin_username: "seanslma"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

sass:
  sass_dir: _sass
  # style: compressed

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    # language_aliases:
    #   py: python
    #   rs: rust
    #   js: javascript
    #   sh: bash
  parse_block_html: true # allow parsing of Markdown inside raw HTML blocks

# rawposts:
#   highlighter: rouge
#   syntax: github   # <--- change this to github

plugins:
  - jekyll-feed
  - jekyll-sitemap

titles_from_headings:
  strip_title: true
  collections: true

# Tell Jekyll to actually look at the underscore folder
# include: only works for TOP-LEVEL underscore folders (e.g. _maki/)
# It does NOT recursively include nested underscore folders like maki/api/_static
# include:
#   - maki/ # does not work

# keep_files: only protects files Jekyll ITSELF generated in a previous build
# It does NOT protect source underscore folders from being dropped during processing
# keep_files:
#   - maki # not working

# Prevent Jekyll from processing files in maki
# by setting default layout to null for everything in maki
defaults:
  # - scope:
  #     path: "maki"
  #   values:
  #     layout: null # does not work
  - scope:
      path: "blog"
      type: posts
    values:
      tags: ["Other"]

# Ignore these files or directories completely when building the site
# Excluded files are not copied to _site and are not processed by Jekyll
# So it won't delete the underscore folders in mapu
exclude:
  - mapu/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .bundle/
  - README.md
  - LICENSE

header_pages:
  - index.md
  - maki.md
  - mapu.md
  - blog.md

counter_analytics: true
